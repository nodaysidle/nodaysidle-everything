[workspace]
resolver = "3"
members = [
    "crates/craft-core",
    "crates/craft-browser",
    "crates/craft-inspect",
    "crates/craft-agents",
    "crates/craft-compare",
    "crates/craft-app",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
tokio-util = "0.7"
tokio-tungstenite = "0.30"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
goblin = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
infer = "0.22"
tower = { version = "0.5", features = ["util"] }

craft-core = { path = "crates/craft-core" }
craft-browser = { path = "crates/craft-browser" }
craft-inspect = { path = "crates/craft-inspect" }
craft-agents = { path = "crates/craft-agents" }
craft-compare = { path = "crates/craft-compare" }
